<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PrintX">
  <!-- Full-bleed navy (no black corners) -->
  <rect width="512" height="512" fill="#0B1220"/>
  <!-- Bold rounded X -->
  <g fill="#FFFFFF">
    <rect x="118" y="236" width="276" height="40" rx="20" transform="rotate(45 256 256)"/>
    <rect x="118" y="236" width="276" height="40" rx="20" transform="rotate(-45 256 256)"/>
  </g>
  <!-- Center equals bars from brand mark -->
  <rect x="210" y="230" width="92" height="20" rx="5" fill="#12B5D4"/>
  <rect x="210" y="262" width="92" height="20" rx="5" fill="#2563EB"/>
</svg>
