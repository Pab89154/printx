<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Refresh PrintX</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b1220;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      p {
        max-width: 22rem;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.88);
      }
    </style>
  </head>
  <body>
    <p id="msg">Refreshing PrintX…</p>
    <script>
      ;(async function () {
        var msg = document.getElementById('msg')
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations()
            await Promise.all(regs.map(function (r) { return r.unregister() }))
          }
          if (window.caches && caches.keys) {
            var keys = await caches.keys()
            await Promise.all(keys.map(function (k) { return caches.delete(k) }))
          }
        } catch (e) {
          /* continue to reload anyway */
        }
        if (msg) msg.textContent = 'Opening the latest PrintX…'
        var next = '/'
        try {
          var params = new URLSearchParams(location.search)
          var ret = params.get('return')
          if (ret && ret.charAt(0) === '/') next = ret
        } catch (e) {}
        location.replace(next + (next.indexOf('?') >= 0 ? '&' : '?') + '_pwa=' + Date.now())
      })()
    </script>
  </body>
</html>
