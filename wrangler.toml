# PrintX on Cloudflare Workers Free + static assets (no Render sleep, $0/mo).
# Secrets: wrangler secret put NAME  (or set in Dashboard → Workers → Settings)
name = "printx"
main = "workers/printx.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
PRINTX_COOKIE_DOMAIN = ".printx.pw"
PRINTX_GITHUB_REPO = "Pab89154/printx"
PRINTX_GITHUB_REF = "main"
PRINTX_ADMIN_EMAIL = "pablo.molina@printx.pw"
PRINTX_NOTIFY_EMAIL = "hello@printx.pw"
PRINTX_MAIL_FROM = "PrintX <hello@printx.pw>"
VAPID_SUBJECT = "mailto:hello@printx.pw"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ef29c678d4df4aa08f77ade13c43ca69"

[[routes]]
pattern = "printx.pw"
custom_domain = true

[[routes]]
pattern = "www.printx.pw"
custom_domain = true

[[routes]]
pattern = "portal.printx.pw"
custom_domain = true
