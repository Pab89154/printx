services:
  - type: web
    name: printx
    runtime: node
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      - key: PRINTX_ADMIN_PASSWORD
        sync: false
      - key: PRINTX_SESSION_SECRET
        generateValue: true
