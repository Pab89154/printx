# PrintX — single Render Web Service (keeps API + site together).
# Custom cold-start screen: use the Cloudflare Worker in /cloudflare (see cloudflare/HOW_TO.md).
# The free Render spinner cannot be replaced from inside a sleeping web service alone.
#
# Docker runtime for a consistent Node 22 image. Pricing uses Cloud Slicer API
# (local Bambu is not installed in this image).
# If the existing service is still "Node", change Environment → Docker in the Render dashboard
# (or recreate from this blueprint).

services:
  - type: web
    name: printx
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PRINTX_COOKIE_DOMAIN
        value: ".printx.pw"
      - key: PRINTX_ADMIN_PASSWORD
        value: coolprints.X
      - key: PRINTX_ADMIN_EMAIL
        value: pablo.molina@printx.pw
      - key: PRINTX_SESSION_SECRET
        generateValue: true
      # REQUIRED — set in Render Dashboard → Environment (sync: false so secret stays in dashboard):
      # Supabase → Connect → Session pooler URI
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Service role / sb_secret — required for STL Storage (NOT the anon/publishable key)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Email via Resend → hello@printx.pw (set API key after verifying printx.pw domain)
      - key: RESEND_API_KEY
        sync: false
      - key: PRINTX_NOTIFY_EMAIL
        value: hello@printx.pw
      - key: PRINTX_MAIL_FROM
        value: PrintX <hello@printx.pw>
      # Admin phone push (npx web-push generate-vapid-keys → paste both)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@printx.pw
