# PrintX — single Render Web Service (keeps API + site together).
# Custom cold-start screen: use the Cloudflare Worker in /cloudflare (see cloudflare/HOW_TO.md).
# The free Render spinner cannot be replaced from inside a sleeping web service alone.

services:
  - type: web
    name: printx
    runtime: node
    buildCommand: npm run render-build
    # With DATABASE_URL set, start does not need --experimental-sqlite.
    # Keep NODE_OPTIONS only if you temporarily run without DATABASE_URL (SQLite fallback).
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Cookie Domain for printx.pw + portal.printx.pw (also helps behind Cloudflare)
      - key: PRINTX_COOKIE_DOMAIN
        value: ".printx.pw"
      - key: PRINTX_ADMIN_PASSWORD
        value: coolprints.X
      - key: PRINTX_ADMIN_EMAIL
        value: pablo.molina@printx.pw
      - key: PRINTX_SESSION_SECRET
        generateValue: true
      # REQUIRED — set in Render Dashboard → Environment (sync: false so secret stays in dashboard):
      # Supabase → Connect → Session pooler URI
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Email via Resend → hello@printx.pw (set API key after verifying printx.pw domain)
      - key: RESEND_API_KEY
        sync: false
      - key: PRINTX_NOTIFY_EMAIL
        value: hello@printx.pw
      - key: PRINTX_MAIL_FROM
        value: PrintX <hello@printx.pw>
