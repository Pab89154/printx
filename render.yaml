services:
  - type: web
    name: printx
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PRINTX_ADMIN_PASSWORD
        sync: false
      - key: PRINTX_SESSION_SECRET
        generateValue: true
